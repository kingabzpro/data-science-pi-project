[project]
name = "data-science-pi-project"
version = "0.1.0"
description = "Reproducible data-science pipeline for loading, preprocessing, training, and evaluation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "joblib>=1.5.0",
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "scikit-learn>=1.9.0",
    "streamlit>=1.45.0",
]

[dependency-groups]
dev = ["playwright>=1.52.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
